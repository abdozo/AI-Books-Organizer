[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-books-organizer"
version = "1.0.0"
description = "Local Arabic PDF cataloguing web application powered by Gemini"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "pypdfium2>=5,<6",
  "Pillow>=12,<13",
  "google-genai>=1.47,<2",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["organizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
